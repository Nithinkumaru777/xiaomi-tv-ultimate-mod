plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.mitvremote'
    compileSdk 34

    defaultConfig {
        applicationId "com.gathin.mitvremote"
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
